version: '3.8'

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zencart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zencart
      POSTGRES_PASSWORD: zencart_secure_pass
      POSTGRES_DB: zencart
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zencart-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zencart -d zencart']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zencart-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - zencart-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Meilisearch ─────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: zencart-meilisearch
    restart: unless-stopped
    ports:
      - '7700:7700'
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - zencart-network

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:

networks:
  zencart-network:
    driver: bridge